name: Release
# Every push to main (or a manual run) builds a signed release APK and
# publishes it as a GitHub Release. The app's update checker reads the latest
# Release, so the tag must equal the APK's versionName (without the "v").
run-name: "Release 1.3.${{ github.run_number }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # versionCode is above AA Bridge's 5 and grows with every run, so each APK installs as an update.
      # (Workflow expressions have no arithmetic, so it is computed here.)
      - name: Version
        run: |
          echo "VERSION_NAME=1.3.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required SDK platform/build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      # With the RELEASE_KEYSTORE_* secrets set, the APK is signed with your own key.
      # Without them it is signed with the debug key committed in app/, so it still installs.
      # Pick one and keep it: switching keys later means uninstalling the app once.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Signing with the release key from secrets"
          else
            {
              echo "storeFile=debug.keystore"
              echo "storePassword=android"
              echo "keyAlias=androiddebugkey"
              echo "keyPassword=android"
            } > keystore.properties
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set, signing with the committed debug key"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          cp app/build/outputs/apk/release/app-release.apk CarLink.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: CarLink ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: CarLink.apk
